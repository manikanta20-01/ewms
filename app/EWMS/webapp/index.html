<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EWMS</title>
  <script src="https://sapui5.hana.ondemand.com/1.141.0/resources/sap-ui-core.js"
          id="sap-ui-bootstrap"
          data-sap-ui-theme="sap_horizon"
          data-sap-ui-libs="sap.m, sap.f, sap.ui.layout"
          data-sap-ui-async="true"
          data-sap-ui-compatVersion="edge"
          data-sap-ui-xx-waitForTheme="true"></script>
  <style>html,body{height:100%;margin:0}</style>
</head>
<body class="sapUiBody" id="content" role="application">
  <script>
    sap.ui.getCore().attachInit(function () {
      sap.ui.core.Component.create({
        id: "ewms",
        name: "ewms.EWMS",
        url: "./",
        manifestFirst: true,
        async: true
      }).then(function (oComponent) {
        new sap.m.Shell("shell", {
          app: new sap.ui.core.ComponentContainer("container", { height: "100%", component: oComponent })
        }).placeAt("content");
      });
    });
  </script>
</body>
</html>
